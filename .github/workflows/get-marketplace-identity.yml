name: Get Marketplace identity

# Temporary bootstrap workflow. Delete it after retrieving the identity ID and
# before granting the managed identity access to the Marketplace publisher.
on:
  push:
    branches:
      - azure-managed-identioty
    paths:
      - '.github/workflows/get-marketplace-identity.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  get-marketplace-identity:
    name: Get Marketplace identity
    if: github.repository == 'prisma/language-tools' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/azure-managed-identioty')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Log in to Azure
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Marketplace identity ID
        shell: bash
        run: |
          set -euo pipefail

          MARKETPLACE_ID="$(az rest \
            --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id \
            --output tsv)"

          if [[ ! "$MARKETPLACE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "Azure DevOps returned an invalid Marketplace identity ID." >&2
            exit 1
          fi

          echo "::notice title=Marketplace identity ID::$MARKETPLACE_ID"
          {
            echo "## Marketplace identity ID"
            echo
            echo '```text'
            echo "$MARKETPLACE_ID"
            echo '```'
            echo
            echo "Add this ID as a Contributor to the Prisma publisher, then delete this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
